services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: eventual
      POSTGRES_USER: eventual
      # A imagem lê a senha do arquivo montado pelo secret.
      POSTGRES_PASSWORD_FILE: /run/secrets/Database__Password
    secrets:
      - source: db_password
        target: Database__Password
    volumes:
      - eventual-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventual -d eventual"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Eventual.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Dentro da rede do compose o banco é alcançado pelo nome do serviço.
      ConnectionStrings__Eventual: Host=postgres;Port=5432;Database=eventual;Username=eventual
    secrets:
      # Mesmo arquivo; o AddKeyPerFile transforma em Database:Password.
      - source: db_password
        target: Database__Password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  eventual-data:
